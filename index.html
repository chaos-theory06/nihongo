<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Japanese grammar and kanji resources</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 2rem 1rem;
      display: grid;
      place-items: center;
      background: #f4f6f9;
      color: #2c3e50;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    h1 {
      margin: 0;
      text-align: center;
      font-size: clamp(1.75rem, 6vw, 3rem);
    }
    .site-nav {
      position: fixed;
      z-index: 1;
      top: max(1rem, env(safe-area-inset-top));
      left: max(1rem, env(safe-area-inset-left));
    }
    .index-toggle {
      min-height: 44px;
      padding: 0.7rem 1rem;
      border: 0;
      border-radius: 8px;
      background: #2c3e50;
      color: #ffffff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .index-toggle:hover,
    .index-toggle[aria-expanded="true"] {
      background: #435b73;
    }
    .index-toggle:focus-visible,
    .site-nav a:focus-visible {
      outline: 3px solid #818cf8;
      outline-offset: 2px;
    }
    .site-nav-panel {
      width: min(360px, calc(100vw - 2rem));
      max-height: calc(100vh - 5rem);
      max-height: calc(100dvh - 5rem);
      margin-top: 0.5rem;
      padding: 0.5rem;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid #e1e8ed;
      border-radius: 10px;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.16);
    }
    .index-list,
    .index-list ul {
      margin: 0;
    }
    .index-list {
      padding-left: 2rem;
    }
    .index-list > li + li {
      margin-top: 0.5rem;
    }
    .index-list ul {
      padding-left: 1.25rem;
      list-style: disc;
    }
    .index-list ul ul {
      list-style: circle;
    }
    .site-nav a,
    .index-label {
      display: block;
      padding: 0.75rem;
      border-radius: 8px;
      color: #2c3e50;
      font-weight: 600;
      text-decoration: none;
    }
    .index-list ul a,
    .index-list ul .index-label {
      padding: 0.55rem 0.5rem;
      font-weight: 500;
    }
    .index-list > li > a,
    .index-list > li > .index-label {
      font-weight: 700;
    }
    .week-one-row {
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }
    .week-one-row a {
      flex: 1;
    }
    .quiz-launch,
    .quiz-action,
    .quiz-choice {
      min-height: 44px;
      padding: 0.6rem 0.85rem;
      border: 0;
      border-radius: 8px;
      background: #2c3e50;
      color: #ffffff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .quiz-launch:hover,
    .quiz-action:hover:not(:disabled) {
      background: #435b73;
    }
    .quiz-launch:focus-visible,
    .quiz-action:focus-visible,
    .quiz-choice:focus-visible {
      outline: 3px solid #818cf8;
      outline-offset: 2px;
    }
    .quiz-dialog {
      width: min(560px, calc(100% - 2rem));
      max-height: min(90vh, 760px);
      max-height: min(90dvh, 760px);
      padding: 1.5rem;
      overflow-y: auto;
      border: 0;
      border-radius: 14px;
      background: #ffffff;
      color: #2c3e50;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.25);
    }
    .quiz-dialog::backdrop {
      background: rgba(15, 23, 42, 0.62);
    }
    .quiz-dialog h2 {
      margin: 0 0 0.5rem;
    }
    .quiz-progress {
      margin: 0 0 1rem;
      color: #64748b;
      font-weight: 600;
    }
    .quiz-question {
      margin: 0 0 1rem;
      font-size: 1.25rem;
      font-weight: 700;
    }
    .quiz-choices {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.75rem;
    }
    .quiz-choice {
      min-height: 56px;
      background: #f1f5f9;
      color: #2c3e50;
      border: 2px solid #dbe3ec;
      overflow-wrap: anywhere;
    }
    .quiz-choice:hover:not(:disabled) {
      background: #e2e8f0;
    }
    .quiz-choice:disabled {
      cursor: default;
    }
    .quiz-choice.is-correct {
      border-color: #15803d;
      background: #dcfce7;
      color: #14532d;
    }
    .quiz-choice.is-wrong {
      border-color: #b91c1c;
      background: #fee2e2;
      color: #7f1d1d;
    }
    .quiz-feedback {
      min-height: 1.5em;
      margin: 1rem 0;
      font-weight: 700;
    }
    .quiz-feedback.is-correct {
      color: #15803d;
    }
    .quiz-feedback.is-wrong {
      color: #b91c1c;
    }
    .quiz-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
    }
    .quiz-action.cancel {
      background: #e2e8f0;
      color: #2c3e50;
    }
    .quiz-action:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    @media (max-width: 420px) {
      .quiz-dialog {
        padding: 1.25rem;
      }
      .quiz-choices {
        grid-template-columns: 1fr;
      }
    }
    .site-nav a:hover,
    .site-nav a:focus-visible {
      background: #f1f5f9;
    }
    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="site-nav">
    <button class="index-toggle" id="index-toggle" type="button" aria-expanded="false" aria-controls="site-index">Index</button>
    <nav class="site-nav-panel" id="site-index" aria-label="Page index" hidden>
      <ol class="index-list">
        <li>
          <a href="grammar.html">Grammar（文法）</a>
          <ul>
            <li>
              <a href="grammar.html">Conjugations</a>
              <ul>
                <li><a href="grammar.html">Change (変化) positive to negative state　〜なくなる</a></li>
              </ul>
            </li>
          </ul>
        </li>
        <li>
          <span class="index-label">Kanji (漢字)</span>
          <ul>
            <li>
              <span class="index-label">Kanji N4</span>
              <ul>
                <li class="week-one-row">
                  <a href="kanji-week1.html">Kanji week 1</a>
                  <button class="quiz-launch" id="open-kanji-quiz" type="button">Quiz</button>
                </li>
                <li><span class="index-label">Kanji week 2</span></li>
                <li><span class="index-label">Kanji week 3</span></li>
              </ul>
            </li>
          </ul>
        </li>
      </ol>
    </nav>
  </div>
  <main>
    <h1>Japanese grammar and kanji resources</h1>
  </main>
  <dialog class="quiz-dialog" id="kanji-quiz" aria-labelledby="quiz-title">
    <h2 id="quiz-title">Kanji Week 1 Quiz</h2>
    <p class="quiz-progress" id="quiz-progress"></p>
    <p class="quiz-question" id="quiz-question"></p>
    <div class="quiz-choices" id="quiz-choices"></div>
    <p class="quiz-feedback" id="quiz-feedback" role="status" aria-live="polite"></p>
    <div class="quiz-actions">
      <button class="quiz-action cancel" id="cancel-quiz" type="button">Cancel</button>
      <button class="quiz-action" id="next-question" type="button" disabled>Next</button>
    </div>
  </dialog>
  <script>
    const indexToggle = document.getElementById('index-toggle');
    const siteIndex = document.getElementById('site-index');

    function setIndexExpanded(expanded) {
      indexToggle.setAttribute('aria-expanded', String(expanded));
      siteIndex.hidden = !expanded;
    }

    indexToggle.addEventListener('click', () => {
      setIndexExpanded(indexToggle.getAttribute('aria-expanded') !== 'true');
    });

    siteIndex.addEventListener('click', event => {
      if (event.target instanceof HTMLAnchorElement) {
        setIndexExpanded(false);
      }
    });

    document.addEventListener('click', event => {
      if (event.target instanceof Element && !event.target.closest('.site-nav')) {
        setIndexExpanded(false);
      }
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && !siteIndex.hidden) {
        setIndexExpanded(false);
        indexToggle.focus();
      }
    });

    const weekOneKanji = [
      { kanji: '交通', reading: 'こうつう' },
      { kanji: '普通', reading: 'ふつう' },
      { kanji: '通る', reading: 'とおる' },
      { kanji: '通り', reading: 'とおり' },
      { kanji: '通う', reading: 'かよう' },
      { kanji: '降る', reading: 'ふる' },
      { kanji: '降りる', reading: 'おりる' },
      { kanji: '食料品', reading: 'しょくりょうひん' },
      { kanji: '品物', reading: 'しなもの' },
      { kanji: '着る', reading: 'きる' },
      { kanji: '着く', reading: 'つく' },
      { kanji: '動物', reading: 'どうぶつ' },
      { kanji: '荷物', reading: 'にもつ' },
      { kanji: '食べ物', reading: 'たべもの' },
      { kanji: '建物', reading: 'たてもの' },
      { kanji: '運動', reading: 'うんどう' },
      { kanji: '動く', reading: 'うごく' },
      { kanji: '建てる', reading: 'たてる' },
      { kanji: '二階建て', reading: 'にかいだて' },
      { kanji: '今夜', reading: 'こんや' },
      { kanji: '夜', reading: 'よる' },
      { kanji: '台所', reading: 'だいどころ' }
    ];

    const quizDialog = document.getElementById('kanji-quiz');
    const quizProgress = document.getElementById('quiz-progress');
    const quizQuestion = document.getElementById('quiz-question');
    const quizChoices = document.getElementById('quiz-choices');
    const quizFeedback = document.getElementById('quiz-feedback');
    const nextQuestionButton = document.getElementById('next-question');
    let quizQuestions = [];
    let currentQuestionIndex = 0;
    let answered = false;

    function shuffled(items) {
      const result = [...items];
      for (let index = result.length - 1; index > 0; index -= 1) {
        const otherIndex = Math.floor(Math.random() * (index + 1));
        [result[index], result[otherIndex]] = [result[otherIndex], result[index]];
      }
      return result;
    }

    function startQuiz() {
      quizQuestions = shuffled(weekOneKanji).slice(0, 10).map(card => ({
        card,
        asksForKanji: Math.random() < 0.5,
        choices: shuffled(weekOneKanji.filter(option => option !== card)).slice(0, 3)
      }));
      quizQuestions.forEach(question => {
        question.choices.push(question.card);
        question.choices = shuffled(question.choices);
      });
      currentQuestionIndex = 0;
      renderQuestion();
      quizDialog.showModal();
    }

    function renderQuestion() {
      const question = quizQuestions[currentQuestionIndex];
      answered = false;
      quizProgress.textContent = `Question ${currentQuestionIndex + 1} of ${quizQuestions.length}`;
      quizQuestion.textContent = question.asksForKanji
        ? `Which kanji matches the reading ${question.card.reading}?`
        : `What is the reading of ${question.card.kanji}?`;
      quizFeedback.textContent = '';
      quizFeedback.className = 'quiz-feedback';
      nextQuestionButton.disabled = true;
      nextQuestionButton.textContent = currentQuestionIndex === quizQuestions.length - 1 ? 'Finish' : 'Next';
      quizChoices.replaceChildren();

      question.choices.forEach(choice => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'quiz-choice';
        button.textContent = question.asksForKanji ? choice.kanji : choice.reading;
        button.dataset.correct = String(choice === question.card);
        button.addEventListener('click', () => checkAnswer(button, choice, question));
        quizChoices.append(button);
      });
    }

    function checkAnswer(selectedButton, selectedChoice, question) {
      if (answered) {
        return;
      }
      answered = true;
      const isCorrect = selectedChoice === question.card;
      const correctButton = quizChoices.querySelector('[data-correct="true"]');
      correctButton.classList.add('is-correct');
      selectedButton.classList.add(isCorrect ? 'is-correct' : 'is-wrong');
      quizFeedback.classList.add(isCorrect ? 'is-correct' : 'is-wrong');
      quizFeedback.textContent = isCorrect
        ? '✓ Correct!'
        : `✗ Incorrect. Correct answer: ${question.asksForKanji ? question.card.kanji : question.card.reading}`;
      quizChoices.querySelectorAll('button').forEach(button => {
        button.disabled = true;
      });
      nextQuestionButton.disabled = false;
      nextQuestionButton.focus();
    }

    document.getElementById('open-kanji-quiz').addEventListener('click', () => {
      setIndexExpanded(false);
      startQuiz();
    });

    document.getElementById('cancel-quiz').addEventListener('click', () => {
      quizDialog.close();
    });

    quizDialog.addEventListener('close', () => {
      indexToggle.focus();
    });

    nextQuestionButton.addEventListener('click', () => {
      if (currentQuestionIndex === quizQuestions.length - 1) {
        quizDialog.close();
        return;
      }
      currentQuestionIndex += 1;
      renderQuestion();
    });
  </script>
</body>
</html>
